const listEl = document.getElementById('list');
const countEl = document.getElementById('countLine');
const qEl = document.getElementById('q');
const sortEl = document.getElementById('sort');
const chipsEl = document.getElementById('chips');
let curSender = '';
let curSort = 'time-desc';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function apply() {
  const q = qEl.value.trim().toLowerCase();
  let rows = DATA.filter(r => {
    if (curSender && r.sender !== curSender) return false;
    if (!q) return true;
    return (r.topic + ' ' + r.subtitle + ' ' + r.url + ' ' + r.sender + ' ' + r.domain)
      .toLowerCase().includes(q);
  });

  if (curSort === 'time-asc') rows = rows.slice().sort((a,b) => a.ts - b.ts);
  else if (curSort === 'sender') rows = rows.slice().sort((a,b) =>
    a.sender.localeCompare(b.sender,'zh') || (b.ts - a.ts));
  else rows = rows.slice().sort((a,b) => b.ts - a.ts);

  countEl.textContent = '当前显示 ' + rows.length + ' / ' + DATA.length + ' 条';

  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">没有匹配的链接，试试其他关键词或发布人</div>';
    return;
  }

  listEl.innerHTML = rows.map((r, idx) => `
    <div class="card">
      <div class="card-top">
        <h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.topic)}</a></h3>
      </div>
      ${r.subtitle ? `<p class="sub">${esc(r.subtitle)}</p>` : ''}
      <div class="url"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></div>
      <div class="foot">
        <span class="badge ${r.catClass}">${esc(r.cat)}</span>
        <span class="sender-tag">👤 ${esc(r.sender)}</span>
        <span>🕒 ${esc(r.time)}</span>
        <span>🌐 ${esc(r.domain)}</span>
        ${r.internal ? '<span class="warn">⚠ 内网地址，外网不可访问</span>' : ''}
      </div>
    </div>
  `).join('');
}

qEl.addEventListener('input', apply);
sortEl.addEventListener('change', e => { curSort = e.target.value; apply(); });
chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  curSender = btn.dataset.sender || '';
  apply();
});

apply();
</script>
