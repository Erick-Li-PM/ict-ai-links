const CATS = {"🔗 其他链接": 29, "📊 协作文档": 13, "🔧 内部工具": 2};
const SENDERS = ["李杰lijie", "李寅Erick", "陈伟ChenWei", "袁季骜Jeff", "王梓轩Luca"];

const state = { q:'', sender:'__all__', cat:'', sort:'desc' };

// sender nav
const senderList = document.getElementById('senderList');
const senderCounts = {};
LINKS.forEach(l => senderCounts[l.sender] = (senderCounts[l.sender]||0)+1);
SENDERS.forEach(s => {
  const d = document.createElement('div');
  d.className = 'sender-item';
  d.dataset.sender = s;
  d.innerHTML = '<span>'+esc(s)+'</span><span class="cnt">'+(senderCounts[s]||0)+'</span>';
  d.onclick = () => { state.sender = s; render(); };
  senderList.appendChild(d);
});

// category select
const catSel = document.getElementById('cat');
Object.keys(CATS).forEach(c => {
  const o = document.createElement('option'); o.value = c; o.textContent = c + ' (' + CATS[c] + ')';
  catSel.appendChild(o);
});

function esc(s) { return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

function filtered() {
  const q = state.q.trim().toLowerCase();
  let arr = LINKS.filter(l => {
    if (state.sender !== '__all__' && l.sender !== state.sender) return false;
    if (state.cat && l.category !== state.cat) return false;
    if (q) {
      const hay = (l.topic+' '+l.subtitle+' '+l.url+' '+l.sender+' '+l.category).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  arr.sort((a,b) => state.sort === 'desc' ? b.ts - a.ts : a.ts - b.ts);
  return arr;
}

function render() {
  // nav active state
  document.querySelectorAll('.sender-item').forEach(el => {
    el.classList.toggle('active', el.dataset.sender === state.sender);
  });
  const arr = filtered();
  document.getElementById('countLine').textContent = '当前显示 ' + arr.length + ' / ' + LINKS.length + ' 条';
  const list = document.getElementById('list');
  if (!arr.length) { list.innerHTML = '<div class="empty">没有匹配的链接</div>'; return; }
  list.innerHTML = arr.map(l => `
    <div class="card">
      <p class="topic"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.topic)}</a></p>
      ${l.subtitle ? '<p class="sub">'+esc(l.subtitle)+'</p>' : ''}
      <div class="row">
        <span class="tag">${esc(l.category)}</span>
        <span class="who">👤 ${esc(l.sender)}</span>
        <span class="who">🕒 ${esc(l.time)}</span>
        <a class="url" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a>
      </div>
    </div>`).join('');
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; render(); });
catSel.addEventListener('change', e => { state.cat = e.target.value; render(); });
const sortBtn = document.getElementById('sortBtn');
sortBtn.addEventListener('click', () => {
  state.sort = state.sort === 'desc' ? 'asc' : 'desc';
  sortBtn.textContent = state.sort === 'desc' ? '时间 ↓ 最新优先' : '时间 ↑ 最早优先';
  sortBtn.classList.toggle('active', state.sort === 'asc');
  render();
});

render();
</script>
